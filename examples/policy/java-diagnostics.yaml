# Full replacement example: Arthas L1 actions for two roles; Arthas L2 actions and their output only for java-diagnostician, in a UTC time window.
rules:
  - name: administrators
    effect: allow
    roles: [admin]
    operations: [modify_policy, manage_service_accounts, manage_user_roles, manage_hosts, create_join_token, publish_catalog, view_hosts, view_catalog, view_jobs, view_output, view_audit, view_system]
  - name: java-inventory
    effect: allow
    roles: [java-reader, java-diagnostician]
    operations: [view_hosts]
    host_labels: {env: test, team: ops}
  - name: java-metadata
    effect: allow
    roles: [java-reader, java-diagnostician]
    operations: [view_catalog, view_jobs]
  - name: java-arthas-l1
    effect: allow
    roles: [java-reader, java-diagnostician]
    operations: [execute_action, view_output]
    actions: [jvm_arthas_dashboard, jvm_arthas_thread_top, jvm_arthas_thread_blocking, jvm_arthas_thread_info, jvm_arthas_memory, jvm_arthas_jvm, jvm_arthas_class_info, jvm_arthas_method_info, jvm_arthas_classloader_tree, jvm_arthas_classloader_list, jvm_arthas_sysprop, jvm_arthas_version]
    host_labels: {env: test, team: ops}
  - name: java-arthas-l2
    effect: allow
    roles: [java-diagnostician]
    operations: [execute_action]
    actions: [jvm_arthas_watch, jvm_arthas_trace, jvm_arthas_stack, jvm_arthas_monitor, jvm_arthas_jad]
    host_labels: {env: test, team: ops}
    hours: {from: 9, to: 17, timezone: UTC}
  - name: java-arthas-l2-output
    effect: allow
    roles: [java-diagnostician]
    operations: [view_output]
    actions: [jvm_arthas_watch, jvm_arthas_trace, jvm_arthas_stack, jvm_arthas_monitor, jvm_arthas_jad]
    host_labels: {env: test, team: ops}
  - name: java-arthas-l2-deny-readers
    effect: deny
    roles: [java-reader]
    operations: [execute_action, view_output]
    actions: [jvm_arthas_watch, jvm_arthas_trace, jvm_arthas_stack, jvm_arthas_monitor, jvm_arthas_jad]
  - name: catalog-publisher
    effect: allow
    roles: [publisher]
    operations: [publish_catalog]
