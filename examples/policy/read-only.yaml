# Full replacement example: management plus read access to labeled test hosts.
rules:
  - name: administrators
    effect: allow
    roles: [admin]
    operations: [modify_policy, manage_service_accounts, manage_user_roles, manage_hosts, create_join_token, publish_catalog, view_hosts, view_catalog, view_jobs, view_output, view_audit, view_system]
  - name: readers-inventory
    effect: allow
    roles: [ops-reader]
    operations: [view_hosts, view_output]
    host_labels: {env: test, team: ops}
  - name: readers-metadata
    effect: allow
    roles: [ops-reader]
    operations: [view_catalog, view_jobs]
  - name: readers-actions
    effect: allow
    roles: [ops-reader]
    operations: [execute_action]
    risks: [read]
    host_labels: {env: test, team: ops}
  - name: readers-deny-mutations
    effect: deny
    roles: [ops-reader]
    operations: [execute_action]
    risks: [write, dangerous]
  - name: catalog-publisher
    effect: allow
    roles: [publisher]
    operations: [publish_catalog]
