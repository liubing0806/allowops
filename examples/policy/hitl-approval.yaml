# Full replacement example. Assign the requester and approver roles to separate people.
rules:
  - name: administrators
    effect: allow
    roles: [admin]
    operations: [modify_policy, manage_service_accounts, manage_user_roles, manage_hosts, create_join_token, publish_catalog, view_hosts, view_catalog, view_jobs, view_output, view_audit, view_system]
  - name: catalog-publisher
    effect: allow
    roles: [publisher]
    operations: [publish_catalog]
  - name: requester-metadata
    effect: allow
    roles: [java-diagnostician, ops-maintainer]
    operations: [view_hosts, view_catalog, view_jobs]
  - name: java-arthas-l2
    effect: require_approval
    roles: [java-diagnostician]
    operations: [execute_action]
    actions: [jvm_arthas_watch, jvm_arthas_trace, jvm_arthas_stack, jvm_arthas_monitor, jvm_arthas_jad]
    host_labels: {env: prod, team: java}
    approval:
      approver_roles: [java-approver]
      min_approvals: 1
      ttl_seconds: 900
  - name: operations-write-or-dangerous
    effect: require_approval
    roles: [ops-maintainer]
    operations: [execute_action]
    risks: [write, dangerous]
    host_labels: {env: prod, team: ops}
    approval:
      approver_roles: [ops-approver]
      min_approvals: 2
      ttl_seconds: 1800
  - name: java-approvals
    effect: allow
    roles: [java-approver]
    operations: [view_approvals, approve_jobs]
    actions: [jvm_arthas_watch, jvm_arthas_trace, jvm_arthas_stack, jvm_arthas_monitor, jvm_arthas_jad]
    host_labels: {env: prod, team: java}
  - name: operations-approvals
    effect: allow
    roles: [ops-approver]
    operations: [view_approvals, approve_jobs]
    risks: [write, dangerous]
    host_labels: {env: prod, team: ops}
