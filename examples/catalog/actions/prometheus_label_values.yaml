# Label values usage: label=job, or label=__name__ for metric names; optional match selectors.
name: prometheus_label_values
description: List the values of one label, or the metric names with label=__name__, in the configured Prometheus.
risk: read
run_as: root
params: {}
builtin: prometheus_query
builtin_config:
  api: label_values
  address: http://127.0.0.1:9090
  credential: /etc/allowops/credentials/prometheus-main.json
  timeout: 10s
  max_range: 24h
  max_series: 200
  max_response_bytes: 4MB
timeout: 15s
max_output: 64KB
filters: [match, exclude, tail, head, count]
redact:
  builtin: [secrets, pii]
