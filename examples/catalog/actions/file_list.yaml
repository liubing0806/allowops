name: file_list
description: List the immediate contents of an allowed directory.
risk: read
run_as: root
params:
  path:
    type: path
    description: Existing path within the signed allowed roots.
    allowed_roots: [/var/log, /data/logs, /etc/nginx]
exec: [/usr/bin/ls, -lah, --, '{path}']
timeout: 10s
max_output: 64KB
filters: [match, exclude, tail, head, count]
max_scan: 256MB
redact:
  builtin: [secrets]
