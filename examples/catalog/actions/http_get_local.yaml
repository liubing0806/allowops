name: http_get_local
description: Probe an allowed local health endpoint with a bounded GET request.
risk: read
params: {}
builtin: http_get
builtin_config:
  allowed_prefixes: ['http://localhost:8080/health']
  headers:
    Accept: text/plain
  timeout: 5s
  max_response_bytes: 64KB
timeout: 10s
max_output: 64KB
filters: [match, exclude, tail, head, count]
max_scan: 256MB
redact:
  builtin: [secrets, pii]
