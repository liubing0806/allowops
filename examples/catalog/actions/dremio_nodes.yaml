# Usage: params={}.
name: dremio_nodes
description: Show the nodes of a Dremio cluster (sys.nodes) and their memory (sys.memory) with fixed requests. The caller supplies no SQL.
risk: read
run_as: root
params: {}
builtin: dremio_diag
builtin_config:
  ops: [nodes]
  credential: /etc/allowops/credentials/dremio.json
  url: http://127.0.0.1:9047
  max_rows: 100
  max_bytes: 256KB
  timeout: 10s
timeout: 15s
max_output: 64KB
filters: [match, exclude, tail, head, count]
max_scan: 256MB
redact:
  builtin: [secrets, pii]
