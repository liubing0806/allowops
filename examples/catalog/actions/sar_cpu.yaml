name: sar_cpu
description: Read historical sysstat samples within one daily time range.
risk: read
run_as: root
params:
  file:
    type: path
    description: Existing daily sysstat data file.
    allowed_roots: [/var/log/sa]
  start:
    type: string
    description: Start time within the selected daily file.
    regex: ^([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$
    max_len: 8
    default: 00:00:00
  end:
    type: string
    description: End time within the selected daily file.
    regex: ^([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$
    max_len: 8
    default: '23:59:59'
timeout: 20s
exec: [/usr/bin/sar, -u, -f, '{file}', -s, '{start}', -e, '{end}']
max_output: 64KB
filters: [match, exclude, tail, head, count]
max_scan: 256MB
redact:
  builtin: [secrets]
