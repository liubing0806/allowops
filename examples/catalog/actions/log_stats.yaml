name: log_stats
description: Count records of a named log source within a time range (default the last hour), optionally filtered by pattern, exclude and level. Returns matched, first and last match time, a histogram per bucket (default at most 60 buckets), counts by level and by file, and no log text. Use it to find the time range, then read records with log_search. Call log_sources first to list sources.
risk: read
run_as: root
timeout: 30s
builtin: log_query
builtin_config:
  mode: stats
  sources:
    app:
      type: file
      paths: [/data/logs/app/*.log, /data/logs/app/*.log.*]
      timestamp:
        layouts: ['2006-01-02 15:04:05.000', '2006-01-02 15:04:05,000']
        timezone: Asia/Shanghai
      multiline: timestamp_start
      level:
        regex: '^\S+ \S+ \[[^\]]*\] (?P<level>[A-Z]+)'
    nginx-access:
      type: file
      paths: [/var/log/nginx/access.log*]
      timestamp:
        layouts: ['02/Jan/2006:15:04:05 -0700']
        bracketed: true
      multiline: none
    nginx-error:
      type: file
      paths: [/var/log/nginx/error.log*]
      timestamp:
        layouts: ['2006/01/02 15:04:05']
      multiline: none
      level:
        regex: '^\S+ \S+ \[(?P<level>[a-z]+)\]'
  allowed_roots: [/var/log, /data/logs]
  max_files: 50
  max_scan: 256MB
  max_window: 24h
max_output: 64KB
filters: []
redact:
  builtin: [secrets, pii]
