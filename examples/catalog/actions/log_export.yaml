name: log_export
description: Export the records of a named log source within a time range, oldest first, one record per line as "<time> <text>" with newlines in a record written as \n. The last line starts with "# " and gives matched and, when records are left, next_cursor; pass it with unchanged parameters for the next page. Read the output with jobs_get encoding=text or save it with allowops jobs output.
risk: read
run_as: root
timeout: 60s
builtin: log_query
builtin_config:
  mode: export
  sources:
    app:
      type: file
      paths: [/data/logs/app/*.log, /data/logs/app/*.log.*]
      timestamp:
        layouts: ['2006-01-02 15:04:05.000', '2006-01-02 15:04:05,000']
        timezone: Asia/Shanghai
      multiline: timestamp_start
    web-app-stdout:
      type: container_stdout
      container: web-app
      timestamp:
        layouts: ['2006-01-02 15:04:05.000', '2006-01-02 15:04:05,000']
        timezone: Asia/Shanghai
      multiline: timestamp_start
  allowed_roots: [/data/logs]
  max_files: 50
  max_scan: 256MB
  max_window: 24h
  max_record_bytes: 64KB
max_output: 8MB
filters: []
redact:
  builtin: [secrets, pii]
