name: k8s_nodes
description: List cluster nodes with wide output; nodes are cluster-scoped and take no namespace.
risk: read
run_as: root
params: {}
exec: [/usr/bin/kubectl, --kubeconfig, /etc/kubernetes/allowops-readonly.conf, get, nodes, -o, wide]
exec_fallbacks: [/usr/local/bin/kubectl]
timeout: 10s
max_output: 64KB
filters: [match, exclude, tail, head, count]
max_scan: 256MB
redact:
  builtin: [secrets]
