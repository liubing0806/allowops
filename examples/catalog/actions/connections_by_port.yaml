name: connections_by_port
description: Read TCP connections filtered by one numeric port.
risk: read
run_as: root
params:
  port:
    type: int
    description: TCP source or destination port.
    min: 1
    max: 65535
exec: [/usr/sbin/ss, -tnp, (, sport, '=', '{port}', or, dport, '=', '{port}', )]
timeout: 10s
max_output: 64KB
filters: [match, exclude, tail, head, count]
max_scan: 256MB
redact:
  builtin: [secrets]
