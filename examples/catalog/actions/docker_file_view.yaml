name: docker_file_view
description: Read a line-bounded file prefix inside an allowed container.
risk: read
run_as: root
params:
  container:
    type: enum
    description: Container selected from the signed allowlist.
    values: [api, app]
  path:
    type: string
    description: Absolute file path inside the container under a fixed root; no dot segments.
    regex: ^/(var/log|data/logs|etc/nginx)(/[A-Za-z0-9_][A-Za-z0-9._-]*)+$
    max_len: 256
  lines:
    type: int
    description: Maximum number of output lines.
    min: 1
    max: 500
    default: 100
exec: [/usr/bin/docker, exec, '{container}', head, -n, '{lines}', --, '{path}']
timeout: 10s
max_output: 64KB
filters: [match, exclude, tail, head, count]
max_scan: 256MB
redact:
  builtin: [secrets, pii]
