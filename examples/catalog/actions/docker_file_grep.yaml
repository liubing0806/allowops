name: docker_file_grep
description: Search one file inside an allowed container with a bounded match count.
risk: read
run_as: root
params:
  container:
    type: enum
    description: Container selected from the signed allowlist.
    values: [api, app]
  path:
    type: string
    description: Absolute file path inside the container under a fixed root; no dot segments.
    regex: ^/(var/log|data/logs|etc/nginx)(/[A-Za-z0-9_][A-Za-z0-9._-]*)+$
    max_len: 256
  pattern:
    type: string
    description: Bounded fixed search string without line breaks.
    regex: ^[^\r\n]+$
    max_len: 200
  max_matches:
    type: int
    description: Maximum number of matching lines.
    min: 1
    max: 500
    default: 100
exec: [/usr/bin/docker, exec, '{container}', grep, -F, -n, -m, '{max_matches}', -e, '{pattern}', --, '{path}']
timeout: 20s
max_output: 64KB
filters: [match, exclude, tail, head, count]
max_scan: 256MB
redact:
  builtin: [secrets, pii]
  custom:
    - name: sensitive_property
      regex: '(?i)[A-Za-z0-9_.-]*(?:pass|pwd|secret|token|key|credential)[A-Za-z0-9_.-]*\s*[=:].*'
    - name: json_credential
      regex: '(?i)["''][A-Za-z0-9_.-]*(?:pass|pwd|secret|token|key|credential)[A-Za-z0-9_.-]*["'']\s*:\s*(?:"(?:[^"\\]|\\.)*"|''[^'']*''|[^\s,}\]]+)'
    - name: auth_header
      regex: '(?i)\b(?:proxy-)?authorization["'']?\s*:\s*(?:"[^"\r\n]*"|''[^''\r\n]*''|[^\r\n]*)|\b(?:proxy_set_header|add_header|more_set_headers|set_header)\s+["'']?(?:proxy-)?authorization["'']?\s+[^;\r\n]*'
    - name: api_key_header
      regex: '(?i)\bx-[A-Za-z0-9-]*(?:key|token|secret|auth|pass|pwd|credential)[A-Za-z0-9-]*["'']?\s*:\s*(?:"[^"\r\n]*"|''[^''\r\n]*''|[^\r\n]*)|\b(?:proxy_set_header|add_header|more_set_headers|set_header)\s+["'']?[A-Za-z0-9_-]*(?:key|token|secret|pass|pwd|credential)[A-Za-z0-9_-]*["'']?\s+[^;\r\n]*'
    - name: htpasswd_hash
      regex: '\$(?:apr1|1|5|6|2[abxy]|y|7)\$(?:[./0-9A-Za-z,=]+\$)+[./0-9A-Za-z]{20,}|\{S?SHA(?:256|512)?\}[A-Za-z0-9+/=]{20,}'
