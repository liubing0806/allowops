name: docker_stop
description: Stop one allowed application container with a bounded grace period.
risk: write
run_as: root
params:
  container:
    type: enum
    description: Container selected from the signed allowlist.
    values: [api, app]
  grace_seconds:
    type: int
    description: Grace period before Docker forcibly terminates the container.
    min: 0
    max: 30
    default: 10
timeout: 45s
max_output: 16KB
exec: [/usr/bin/docker, stop, --time, '{grace_seconds}', '{container}']
filters: []
redact:
  builtin: [secrets]
idempotent: false
batch_size: 1
max_failures: 1
