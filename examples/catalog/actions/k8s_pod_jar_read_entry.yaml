name: k8s_pod_jar_read_entry
description: Read one application configuration entry from a jar inside an allowed pod without writing files.
risk: read
run_as: root
params:
  namespace:
    type: enum
    description: Namespace selected from the signed allowlist.
    values: [default, app]
  pod:
    type: string
    description: Pod name limited to 63 lowercase DNS characters.
    regex: ^[a-z0-9]([a-z0-9.-]{0,61}[a-z0-9])?$
    max_len: 63
  container:
    type: enum
    description: Optional container selected from the signed allowlist.
    values: [api, app]
    optional: true
  jar:
    type: string
    description: Jar file path under /app, /opt/app or /data/app inside the container; path segments cannot start with a dot.
    regex: '^/(app|opt/app|data/app)(/[A-Za-z0-9_][A-Za-z0-9._-]*)+\.jar$'
    max_len: 200
  entry:
    type: string
    description: Configuration entry name inside the jar; application*.properties, application*.yml or application*.yaml, optionally under BOOT-INF/classes/.
    regex: '^(BOOT-INF/classes/)?application[A-Za-z0-9_.-]*\.(properties|yml|yaml)$'
    max_len: 120
exec: [/usr/bin/kubectl, --kubeconfig, /etc/kubernetes/allowops-readonly.conf, exec, '{pod}', -n, '{namespace}', [-c, '{container}'], --, unzip, -p, '{jar}', '{entry}']
exec_fallbacks: [/usr/local/bin/kubectl]
timeout: 15s
max_output: 64KB
filters: [match, exclude, tail, head, count]
max_scan: 256MB
redact:
  builtin: [secrets, pii]
  custom:
    - name: sensitive_property
      regex: '(?i)[A-Za-z0-9_.-]*(?:pass|pwd|secret|token|key|credential)[A-Za-z0-9_.-]*\s*[=:].*'
    - name: json_credential
      regex: '(?i)["''][A-Za-z0-9_.-]*(?:pass|pwd|secret|token|key|credential)[A-Za-z0-9_.-]*["'']\s*:\s*(?:"(?:[^"\\]|\\.)*"|''[^'']*''|[^\s,}\]]+)'
    - name: quoted_key_credential
      regex: '(?i)(?:"[A-Za-z0-9_.-]*(?:pass|pwd|secret|token|key|credential)[A-Za-z0-9_.-]*"|''[A-Za-z0-9_.-]*(?:pass|pwd|secret|token|key|credential)[A-Za-z0-9_.-]*'')\s*=\s*(?:"(?:[^"\\]|\\.)*"|''[^'']*''|[^\s,}\]]+)'
    - name: xml_name_value_credential
      regex: '(?i)<(?:[A-Za-z0-9_.:-]*[-_:])?(?:name|key)(?:\s[^>]*)?>[^<]*(?:pass|pwd|secret|token|key|credential)[^<]*</[^>]+>(?:\s*<(?:description|final|source)[^>]*>[^<]*</(?:description|final|source)>)*\s*<(?:[A-Za-z0-9_.:-]*[-_:])?value(?:\s[^>]*)?>(?:<!\[CDATA\[.*?\]\]>|[^<])*</[^>]+>'
    - name: xml_text_value_credential
      regex: '(?i)<[A-Za-z0-9_.:-]+\s[^>]*?\b(?:name|key|id|var)\s*=\s*(?:"[^"]*(?:pass|pwd|secret|token|key|credential)[^"]*"|''[^'']*(?:pass|pwd|secret|token|key|credential)[^'']*'')(?:[^>]*[^>/])?>(?:(?:<!\[CDATA\[.*?\]\]>|<value[^>]*>(?:<!\[CDATA\[.*?\]\]>|[^<])*</value>|[^<])*</[A-Za-z0-9_.:-]+\s*>|\s*[^<\s][^<]*$)'
    - name: xml_element_credential
      regex: '(?i)<[A-Za-z0-9_.:-]*(?:pass|pwd|secret|token|key|credential)[A-Za-z0-9_.:-]*(?:\s[^>]*)?>(?:<!\[CDATA\[.*?\]\]>|[^<])*</[^>]+>'
    - name: xml_attribute_credential
      regex: '(?i)\b(?:name|key|id|var)\s*=\s*["''][^"'']*(?:pass|pwd|secret|token|key|credential)[^"'']*["'']\s+[^>]*?\bvalue\s*=\s*(?:"[^"]*"|''[^'']*'')|\bvalue\s*=\s*(?:"[^"]*"|''[^'']*'')\s+[^>]*?\b(?:name|key|id|var)\s*=\s*["''][^"'']*(?:pass|pwd|secret|token|key|credential)[^"'']*["'']'
    - name: auth_header
      regex: '(?i)\b(?:proxy-)?authorization["'']?\s*:\s*(?:"[^"\r\n]*"|''[^''\r\n]*''|[^\r\n]*)|\b(?:proxy_set_header|add_header|more_set_headers|set_header)\s+["'']?(?:proxy-)?authorization["'']?\s+[^;\r\n]*'
    - name: api_key_header
      regex: '(?i)\bx-[A-Za-z0-9-]*(?:key|token|secret|auth|pass|pwd|credential)[A-Za-z0-9-]*["'']?\s*:\s*(?:"[^"\r\n]*"|''[^''\r\n]*''|[^\r\n]*)|\b(?:proxy_set_header|add_header|more_set_headers|set_header)\s+["'']?[A-Za-z0-9_-]*(?:key|token|secret|pass|pwd|credential)[A-Za-z0-9_-]*["'']?\s+[^;\r\n]*'
    - name: htpasswd_hash
      regex: '\$(?:apr1|1|5|6|2[abxy]|y|7)\$(?:[./0-9A-Za-z,=]+\$)+[./0-9A-Za-z]{20,}|\{S?SHA(?:256|512)?\}[A-Za-z0-9+/=]{20,}'
    - name: nginx_param_credential
      regex: '(?i)\b(?:[a-z0-9_]+_param|[a-z0-9_]*set_header|more_set_input_headers|add_trailer)\s+["'']?[A-Za-z0-9_.-]*(?:pass|pwd|secret|token|key|credential)[A-Za-z0-9_.-]*["'']?\s+[^;\r\n]*|\bset\s+\$[A-Za-z0-9_]*(?:pass|pwd|secret|token|key|credential)[A-Za-z0-9_]*\s+[^;\r\n]*'
    - name: nginx_secret_directive
      regex: '(?i)^\s*(?:#+\s*)?(?:[A-Za-z0-9_]*(?:passwd|password|pwd|secret|credentials?|passphrase)[A-Za-z0-9_]*|[A-Za-z0-9_]*_token)\s+(?:"(?:[^"\\\r\n]|\\.)*"|''[^''\r\n]*''|[^;\r\n]*)'
