name: log_sources
description: List the named log sources on the host with file counts, sizes and covered time range. Call this first, then log_search with a source name and time range.
risk: read
run_as: root
timeout: 30s
builtin: log_query
builtin_config:
  mode: sources
  sources:
    app:
      type: file
      paths: [/data/logs/app/*.log, /data/logs/app/*.log.*]
      timestamp:
        layouts: ['2006-01-02 15:04:05.000', '2006-01-02 15:04:05,000']
        timezone: Asia/Shanghai
      multiline: timestamp_start
      level:
        regex: '^\S+ \S+ \[[^\]]*\] (?P<level>[A-Z]+)'
    nginx-access:
      type: file
      paths: [/var/log/nginx/access.log*]
      timestamp:
        layouts: ['02/Jan/2006:15:04:05 -0700']
        bracketed: true
      multiline: none
    nginx-error:
      type: file
      paths: [/var/log/nginx/error.log*]
      timestamp:
        layouts: ['2006/01/02 15:04:05']
      multiline: none
      level:
        regex: '^\S+ \S+ \[(?P<level>[a-z]+)\]'
  allowed_roots: [/var/log, /data/logs]
max_output: 64KB
filters: []
redact:
  builtin: [secrets, pii]
