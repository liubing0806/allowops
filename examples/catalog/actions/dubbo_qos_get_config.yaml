# url usage: url=http://127.0.0.1:22222/getConfig.
name: dubbo_qos_get_config
description: Dump the effective Dubbo configuration through the local QoS HTTP endpoint (GET /getConfig); credentials are redacted.
risk: read
params: {}
builtin: http_get
builtin_config:
  allowed_prefixes: ['http://127.0.0.1:22222/getConfig']
  headers:
    Accept: application/json
  timeout: 5s
  max_response_bytes: 64KB
timeout: 10s
max_output: 64KB
filters: [match, exclude, tail, head, count]
max_scan: 256MB
redact:
  builtin: [secrets, pii]
  custom:
    - name: json_credential
      regex: '(?i)"[A-Za-z0-9_.-]*(?:password|passwd|secret|token|accesskey)[A-Za-z0-9_.-]*"\s*:\s*"(?:[^"\\]|\\.)*"'
