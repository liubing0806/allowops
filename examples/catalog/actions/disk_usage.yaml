name: disk_usage
description: Read filesystem capacity excluding temporary filesystems.
risk: read
toolset: system
tags: [disk, filesystem, capacity]
entity_kinds: [host]
params: {}
exec: [/usr/bin/df, -h, -x, tmpfs, -x, devtmpfs]
timeout: 10s
max_output: 64KB
filters: [match, exclude, tail, head, count]
max_scan: 256MB
redact:
  builtin: [secrets]
