# Alerts of this Prometheus only; Alertmanager aggregates alerts of several Prometheus servers.
name: prometheus_alerts
description: List the current alerts of the configured Prometheus.
risk: read
run_as: root
params: {}
builtin: prometheus_query
builtin_config:
  api: alerts
  address: http://127.0.0.1:9090
  credential: /etc/allowops/credentials/prometheus-main.json
  timeout: 10s
  max_series: 100
  max_response_bytes: 4MB
timeout: 15s
max_output: 64KB
filters: [match, exclude, tail, head, count]
redact:
  builtin: [secrets, pii]
