# Usage: params={"since": "2h", "state": "FAILED", "min_duration": "5s", "user": "alice", "limit": 20}; all optional.
name: dremio_jobs_recent
description: List recent Dremio jobs from the job list (state, user, start time, duration, rows scanned, shortened statement). Filter by time window, state, minimum duration and user; slowest first when a minimum duration is given.
risk: read
run_as: root
params: {}
builtin: dremio_diag
builtin_config:
  ops: [jobs]
  credential: /etc/allowops/credentials/dremio.json
  url: http://127.0.0.1:9047
  max_rows: 100
  max_bytes: 256KB
  timeout: 10s
timeout: 15s
max_output: 64KB
filters: [match, exclude, tail, head, count]
max_scan: 256MB
redact:
  builtin: [secrets, pii]
