# Series usage: match=["up{job=\"api\"}"], optional start/end within max_range.
name: prometheus_series
description: List the series that match selectors in the configured Prometheus.
risk: read
run_as: root
params: {}
builtin: prometheus_query
builtin_config:
  api: series
  address: http://127.0.0.1:9090
  credential: /etc/allowops/credentials/prometheus-main.json
  timeout: 10s
  max_range: 24h
  max_series: 50
  max_response_bytes: 4MB
timeout: 15s
max_output: 64KB
filters: [match, exclude, tail, head, count]
redact:
  builtin: [secrets, pii]
