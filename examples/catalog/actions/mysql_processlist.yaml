name: mysql_processlist
description: List MySQL connections and running statements with SHOW PROCESSLIST.
risk: read
run_as: root
params:
  database:
    type: string
    description: Default database fixed to app; signed configuration restricts explicit database references.
    regex: ^app$
    max_len: 3
  sql:
    type: string
    description: Fixed SHOW PROCESSLIST statement; FULL returns complete statement text.
    regex: ^SHOW (FULL )?PROCESSLIST$
    max_len: 21
timeout: 15s
builtin: mysql_query
builtin_config:
  credential: /etc/allowops/credentials/mysql-main.json
  address: unix:///var/run/mysqld/mysqld.sock
  max_rows: 500
  timeout: 10s
  databases: [app]
  statement_types: [SHOW]
  show_types: [PROCESSLIST]
max_output: 64KB
filters: [match, exclude, tail, head, count]
max_scan: 256MB
redact:
  builtin: [secrets, pii]
  custom:
    - name: sql_text
      before_builtin: true
      regex: '(?s)/\*.*?(?:\*/|$)|--(?:[ \t\r\f\v][^\n]*|$)|#[^\n]*|''(?:[^''\\]|\\.|'''')*(?:''|\\?$)|"(?:[^"\\]|\\.|"")*(?:"|\\?$)|`(?:[^`]|``)*(?:`|$)'
    - name: sql_hex_literal
      regex: '(?i)\b0x[0-9a-f]+\b'
