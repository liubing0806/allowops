# Range query usage: query="rate(http_requests_total[5m])", start=now-1h, summary=true prints min, avg, max and last per series.
name: prometheus_query_range
description: Run a bounded read-only PromQL range query against the configured Prometheus.
risk: read
run_as: root
params: {}
builtin: prometheus_query
builtin_config:
  api: query_range
  address: http://127.0.0.1:9090
  credential: /etc/allowops/credentials/prometheus-main.json
  timeout: 10s
  max_range: 24h
  min_step: 15s
  max_points: 300
  max_series: 50
  max_response_bytes: 4MB
timeout: 15s
max_output: 64KB
filters: [match, exclude, tail, head, count]
redact:
  builtin: [secrets, pii]
