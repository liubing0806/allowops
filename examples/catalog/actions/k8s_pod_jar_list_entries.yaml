name: k8s_pod_jar_list_entries
description: List entry names of one jar under an application directory inside an allowed pod.
risk: read
run_as: root
params:
  namespace:
    type: enum
    description: Namespace selected from the signed allowlist.
    values: [default, app]
  pod:
    type: string
    description: Pod name limited to 63 lowercase DNS characters.
    regex: ^[a-z0-9]([a-z0-9.-]{0,61}[a-z0-9])?$
    max_len: 63
  container:
    type: enum
    description: Optional container selected from the signed allowlist.
    values: [api, app]
    optional: true
  jar:
    type: string
    description: Jar file path under /app, /opt/app or /data/app inside the container; path segments cannot start with a dot.
    regex: '^/(app|opt/app|data/app)(/[A-Za-z0-9_][A-Za-z0-9._-]*)+\.jar$'
    max_len: 200
exec: [/usr/bin/kubectl, --kubeconfig, /etc/kubernetes/allowops-readonly.conf, exec, '{pod}', -n, '{namespace}', [-c, '{container}'], --, jar, tf, '{jar}']
exec_fallbacks: [/usr/local/bin/kubectl]
timeout: 20s
max_output: 128KB
filters: [match, exclude, tail, head, count]
max_scan: 256MB
redact:
  builtin: [secrets]
