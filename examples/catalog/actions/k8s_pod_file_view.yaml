name: k8s_pod_file_view
description: Read a line-bounded file prefix inside one pod container.
risk: read
run_as: root
params:
  namespace:
    type: enum
    description: Namespace selected from the signed allowlist.
    values: [default, app]
  pod:
    type: string
    description: Pod name limited to 63 lowercase DNS characters.
    regex: ^[a-z0-9]([a-z0-9.-]{0,61}[a-z0-9])?$
    max_len: 63
  container:
    type: enum
    description: Optional container selected from the signed allowlist.
    values: [api, app]
    optional: true
  path:
    type: string
    description: Absolute file path inside the container under a fixed root; no dot segments.
    regex: ^/(var/log|data/logs|etc/nginx)(/[A-Za-z0-9_][A-Za-z0-9._-]*)+$
    max_len: 256
  lines:
    type: int
    description: Maximum number of output lines.
    min: 1
    max: 500
    default: 100
exec: [/usr/bin/kubectl, --kubeconfig, /etc/kubernetes/allowops-readonly.conf, exec, -n, '{namespace}', '{pod}',
  [-c, '{container}'], --, head, -n, '{lines}', --, '{path}']
exec_fallbacks: [/usr/local/bin/kubectl]
timeout: 15s
max_output: 64KB
filters: [match, exclude, tail, head, count]
max_scan: 256MB
redact:
  builtin: [secrets, pii]
