name: mysql_slow_log
description: Search MySQL or MariaDB slow query logs, plain or gzip, with bounded scan and match limits.
risk: read
run_as: root
params:
  path_glob:
    type: string
    description: Slow log path glob directly under /var/log, /var/log/mysql or /var/log/mariadb.
    regex: ^/var/log/((mysql|mariadb)/)?[A-Za-z0-9_*?-]*slow[A-Za-z0-9_.*?-]*$
    max_len: 128
  pattern:
    type: string
    description: Bounded search pattern without line breaks.
    regex: ^[^\r\n]+$
    max_len: 200
timeout: 30s
builtin: log_search
builtin_config:
  allowed_roots: [/var/log]
  max_files: 20
  max_scan: 256MB
  max_context: 10
  max_matches: 500
max_output: 64KB
filters: [match, exclude, tail, head, count]
max_scan: 256MB
redact:
  builtin: [secrets, pii]
