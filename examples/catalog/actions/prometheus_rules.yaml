# Rules usage: optional rule_type=alert or record.
name: prometheus_rules
description: List alerting and recording rules of the configured Prometheus with their health and last error.
risk: read
run_as: root
params: {}
builtin: prometheus_query
builtin_config:
  api: rules
  address: http://127.0.0.1:9090
  credential: /etc/allowops/credentials/prometheus-main.json
  timeout: 10s
  max_series: 200
  max_response_bytes: 4MB
timeout: 15s
max_output: 64KB
filters: [match, exclude, tail, head, count]
redact:
  builtin: [secrets, pii]
