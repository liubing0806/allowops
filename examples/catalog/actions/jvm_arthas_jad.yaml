# Usage: target=<name of an entry in builtin_config.targets>. class=<binary name that starts with an entry of class_prefixes, no wildcards>.
# [method=<name, no wildcards>, only this method is decompiled].
# Attaches the Arthas agent to the JVM, runs `jad --source-only <class> [method]` and shuts the agent down. The JVM retransforms the class
# to obtain its current bytecode and writes it to <Arthas log directory>/classdump/ (default ~/logs/arthas of the JVM user), where the
# file stays. The attach and the retransform change the JVM, so the action has risk write; the output is the source code of the
# application, so it is authorized apart from the L1 actions (see examples/policy/java-diagnostics.yaml). The call is refused when the
# JVM used 50% or more of its CPU limit over 5 seconds, has too little memory left or has been attached too often. The output starts
# with a `# call` section (status, check, attach number, CPU before the attach, enhanced classes after the reset, clean-up result);
# the source follows, with secrets and personal data redacted.
name: jvm_arthas_jad
description: Decompile a loaded class, or one method of it, of an allowlisted JVM to Java source through the Arthas agent. The JVM writes the class file to the Arthas log directory of its user, where it stays. A call usually takes about 10 seconds.
risk: write
run_as: root
idempotent: false
params: {}
builtin: jvm_arthas
builtin_config:
  command: jad
  targets:
    api:
      systemd_unit: api.service
    shop-web:
      container: shop-web
      main_class: com.example.shop.Main
  sha256:
    arthas-agent.jar: b5bf8765c7621849889fb6522a296fa177ceb3f5c2c2b6d9f631d761ca9c04f9
    arthas-core.jar: 7cbc3dc36ec29e96ae044845ad6b690b790a800e45d0694fcfbe90c9725de813
    arthas-spy.jar: d11cfc1cee83eb46501d5b9719ea49117db2a9e7cbdab9e83e376716255380a6
    arthas.properties: a507ed264d99387b6e1717f8ad6f257dba79de983f5b6617a8c63e38975acec1
    logback.xml: e038b9c097cf0fe801483c65871565f6d120c1365c4d55b65666b05d533f7445
  class_prefixes: [com.example.]
timeout: 90s
max_output: 128KB
filters: [match, exclude, tail, head, count]
redact:
  builtin: [secrets, pii]
batch_size: 1
max_failures: 1
max_targets: 1
