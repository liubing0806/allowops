name: file_view
description: Read a line-bounded file prefix with a bounded output size.
risk: read
run_as: root
params:
  path:
    type: path
    description: Existing path within the signed allowed roots.
    allowed_roots: [/var/log, /data/logs, /etc/nginx]
  lines:
    type: int
    description: Maximum number of output lines.
    min: 1
    max: 500
    default: 100
exec: [/usr/bin/head, -n, '{lines}', --, '{path}']
timeout: 10s
max_output: 64KB
filters: [match, exclude, tail, head, count]
max_scan: 256MB
redact:
  builtin: [secrets, pii]
