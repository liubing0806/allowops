# Local file paths and public endpoint are deployment-specific.
address: ':443'
tls_certificate: /etc/allowops/tls.pem
tls_key: /etc/allowops/tls.key
ca_certificate: /etc/allowops/host-ca.pem
ca_key: /etc/allowops/host-ca.key
catalog_keys: /etc/allowops/catalog-keys
identity:
  origin: https://gateway.example.org
gateway:
  version: '0.2.0'
  certificate_ttl: 24h
  single_join_ttl: 24h
  multi_join_ttl: 24h
management:
  upstream: https://gateway.example.org
  # Optional when tls.pem contains a self-signed root CA.
  # Otherwise set sha256:<64 hex digits of the gateway TLS root CA DER>.
  ca_pin: ''
  preview_ttl: 10m
  upload_ttl: 1h
  max_csv_bytes: 524288
  max_csv_rows: 5000
  label_count: 128
  label_key_bytes: 128
  label_value_bytes: 1024
  label_count_buckets: 200

# Optional MCP tool exposure mode. Default mode is flat for compatibility.
# Set auto (switches to progressive above auto_threshold visible actions, default 40)
# or progressive for large catalogs (100+ actions).
# mcp:
#   mode: auto
#   auto_threshold: 40

# Optional HITL approval limits and console deep-link origin (for require_approval policies).
# approvals:
#   default_ttl: 30m          # 1m..max_ttl
#   max_ttl: 24h              # default_ttl..168h
#   max_pending_per_subject: 10   # 1..100
#   max_pending_global: 1000      # 1..10000
#   sweep_interval: 15s           # 1s..5m
#   console_base_url: https://gateway.example.org  # HTTPS origin; defaults to identity.origin

