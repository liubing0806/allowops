version: v2
clean: true
plugins:
  - local: [go, run, google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12]
    out: gen
    opt: paths=source_relative
  - local: [go, run, connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.21.0]
    out: gen
    opt: paths=source_relative
  # Connect-ES 2 uses the service descriptors emitted by protoc-gen-es.
  # The exact generator version is pinned in web/package.json and pnpm-lock.yaml.
  - local: [web/node_modules/.bin/protoc-gen-es]
    out: web/src/gen
    opt:
      - target=ts
      - json_types=true
