syntax = "proto3";

package allowops.v1;

import "allowops/v1/common.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/liubing0806/allowops/gen/allowops/v1;allowopsv1";

service JobService {
  rpc RunJob(RunJobRequest) returns (RunJobResponse);
  rpc GetJob(GetJobRequest) returns (GetJobResponse);
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  rpc ListTaskSteps(ListTaskStepsRequest) returns (ListTaskStepsResponse);
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse);
  rpc GetJobOutput(GetJobOutputRequest) returns (GetJobOutputResponse);
}

message TaskCount {
  TaskStatus status = 1;
  uint64 count = 2;
}

// Metadata only; even output previews require view_output authorization.
message Job {
  string job_id = 1;
  string action = 2;
  CatalogRef catalog = 3;
  bytes action_sha256 = 4;
  string subject_id = 5;
  string reason = 6;
  JobStatus status = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp finished_at = 9;
  uint64 total_tasks = 10;
  repeated TaskCount counts = 11;
  uint64 policy_version = 12;
}

message Task {
  string job_id = 1;
  string task_id = 2;
  string host_id = 3;
  string hostname = 4;
  ExecutionResult result = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp finished_at = 7;
  bool output_stored = 8;
  uint32 step_count = 9;
}

message TaskStep {
  uint32 index = 1;
  string name = 2;
  ExecutionResult result = 3;
}

message RunJobRequest {
  string action = 1;
  HostTargets targets = 2;
  optional uint64 expected_count = 3;
  Parameters params = 4;
  string reason = 5;
  optional uint32 wait_seconds = 6;
  optional uint32 batch_size = 7;
  optional uint32 max_failures = 8;
  OutputFilters filters = 9;
  string response_format = 10;
}

message RunJobResponse {
  Job job = 1;
  JobSummary summary = 2;
}

message GetJobRequest {
  string job_id = 1;
  optional uint32 wait_seconds = 2;
  string response_format = 3;
}

message GetJobResponse {
  Job job = 1;
  JobSummary summary = 2;
}

// G39: previews require view_output. Concise samples at most two hostnames;
// detailed includes as many as the response byte budget permits.
message OutputGroup {
  optional int32 exit_code = 1;
  bytes stdout_sha256 = 2;
  bytes stderr_sha256 = 3;
  uint64 host_count = 4;
  repeated string hosts = 5;
  string stdout = 6;
  string stderr = 7;
  bool truncated = 8;
  // ExecutionResult.reason shared by the group; empty for success or old agents.
  string reason = 9;
}

message JobSummary {
  repeated OutputGroup groups = 1;
  repeated string offline_hosts = 2;
  OutputTrust output_trust = 3;
  // Indicates omitted groups, hostnames or previews due to the response budget.
  bool truncated = 4;
}

message ListJobsRequest {
  PageRequest page = 1;
  TimeRange created = 2;
  repeated JobStatus statuses = 3;
  string action = 4;
  string subject_id = 5;
}

message ListJobsResponse {
  repeated Job jobs = 1;
  PageResponse page = 2;
}

message ListTasksRequest {
  string job_id = 1;
  PageRequest page = 2;
  repeated TaskStatus statuses = 3;
  string hostname = 4;
}

message ListTasksResponse {
  repeated Task tasks = 1;
  PageResponse page = 2;
}

message ListTaskStepsRequest {
  string job_id = 1;
  string task_id = 2;
  PageRequest page = 3;
}

message ListTaskStepsResponse {
  repeated TaskStep steps = 1;
  PageResponse page = 2;
}

message CancelJobRequest {
  string job_id = 1;
}

message CancelJobResponse {
  Job job = 1;
}

message GetJobOutputRequest {
  string job_id = 1;
  string hostname = 2;
  optional uint32 step_index = 3;
  OutputStream stream = 4;
  uint64 offset = 5;
  uint32 limit_bytes = 6;
}

message GetJobOutputResponse {
  bytes data = 1;
  uint64 next_offset = 2;
  bool eof = 3;
  bool truncated = 4;
  bool scan_limit_reached = 5;
  bool output_stored = 6;
  OutputTrust output_trust = 7;
  OutputMetadata output = 8;
}
