{{- if .Values.credentials.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.credentials.existingSecret }}
  labels:
{{ include "allowops.labels" . | indent 4 }}
type: Opaque
stringData:
  ca.crt: {{ required "credentials.data.caCertificate required" .Values.credentials.data.caCertificate | quote }}
  ca.key: {{ required "credentials.data.caKey required" .Values.credentials.data.caKey | quote }}
  tls.crt: {{ required "credentials.data.tlsCertificate required" .Values.credentials.data.tlsCertificate | quote }}
  tls.key: {{ required "credentials.data.tlsKey required" .Values.credentials.data.tlsKey | quote }}
  catalog.pub.pem: {{ required "credentials.data.catalogPublicKey required" .Values.credentials.data.catalogPublicKey | quote }}
{{- end }}
{{- if .Values.database.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.database.existingSecret }}
  labels:
{{ include "allowops.labels" . | indent 4 }}
type: Opaque
stringData:
  {{ .Values.database.key }}: {{ required "database.url required" .Values.database.url | quote }}
{{- end }}
