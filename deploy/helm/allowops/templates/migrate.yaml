apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "allowops.name" . }}-migrate
  labels:
{{ include "allowops.labels" . | indent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
{{ include "allowops.labels" . | indent 8 }}
        app.kubernetes.io/component: migration
    spec:
{{ include "allowops.maintenancePod" (dict "Values" .Values "name" "migrate" "args" (list "migrate")) | indent 6 }}
