apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "allowops.name" . }}
  labels:
{{ include "allowops.labels" . | indent 4 }}
data:
  gateway.yaml: |
{{ include "allowops.config" . | indent 4 }}
    audit:
      cursor_key_file: /run/allowops/credentials/audit-cursor-key
      export:
        enabled: false
  exporter.yaml: |
{{ include "allowops.config" . | indent 4 }}
    audit:
      cursor_key_file: /run/allowops/credentials/audit-cursor-key
      export:
        enabled: true
      export_directory: /var/lib/allowops/audit
      cursor_name: {{ .Values.audit.cursorName | quote }}
      max_file_bytes: {{ .Values.audit.maxFileBytes }}
