replicaCount: 2
image:
  repository: allowops-gateway
  tag: "0.2.0"
  pullPolicy: IfNotPresent
imagePullSecrets: []
# Kubernetes container environment entries and sources for gateway and exporter.
extraEnv: []
envFrom: []
# Kubernetes volumes and container mounts for gateway and exporter.
extraVolumes: []
extraVolumeMounts: []
service:
  type: LoadBalancer
  annotations: {}
# ALPN and TLS terminate in the gateway. Only use an L4 TCP load balancer.
gateway:
  shutdownGraceSeconds: 10
  # Empty uses the gateway's default host certificate lifetime.
  certificateTTL: ""
  # Optional: wait_seconds, max_wait_seconds, batch_size, max_failures.
  jobs: {}
  management:
    ca_pin: ""
    # upstream defaults to identity.origin; use the public TLS endpoint.
  identity:
    origin: https://allowops.example.com
  providers: []
  # Secret-backed environment variables for the names that providers read through
  # bind_password_env / client_secret_env. Values never enter the ConfigMap.
  # providerSecretEnv:
  #   - name: ALLOWOPS_LDAP_BIND_PASSWORD
  #     secretName: allowops-ldap
  #     key: bind-password
  providerSecretEnv: []
credentials:
  # Keys: ca.crt, ca.key (PKCS8), tls.crt (full chain), tls.key, and at least one catalog*.pub.pem.
  existingSecret: allowops-credentials
  create: false
  data:
    caCertificate: ""
    caKey: ""
    tlsCertificate: ""
    tlsKey: ""
    catalogPublicKey: ""
database:
  existingSecret: allowops-database
  key: url
  create: false
  url: ""
migration:
  # Must exist before helm install: pre-install hooks precede normal Secrets.
  existingSecret: allowops-migration-database
  key: url
  activeDeadlineSeconds: 300
partitions:
  enabled: true
  # Runs in UTC and uses the migration database Secret.
  schedule: "0 2 1,15 * *"
  months: 3
  activeDeadlineSeconds: 300
audit:
  # Exactly one export instance; API replicas never export files.
  enabled: true
  cursorKeySecret: allowops-audit-cursor
  cursorKeyKey: audit-cursor-key
  cursorName: allowops-export
  maxFileBytes: 16777216
  persistence:
    size: 10Gi
    storageClass: ""
output:
  bucket: allowops-demo
  region: us-east-1
  # Empty endpoint uses the AWS regional S3 endpoint. Set for SeaweedFS.
  endpoint: ""
  # Defaults to true with a custom endpoint and false with the AWS endpoint.
  # use_path_style: false
  # Defaults to AES256. Set to "none" to omit the upload encryption header.
  # server_side_encryption: "none"
  existingSecret: allowops-output
  credentialsKey: aws-credentials
# Used only to copy Kubernetes Secret projections into ordinary 0600 files.
secretCopyImage: alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi
podDisruptionBudget:
  minAvailable: 1
