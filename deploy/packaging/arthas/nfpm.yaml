# Packages only the staged Arthas files; there is no Go binary in this package.
# build.sh exports the variables expanded here.
name: allowops-arthas
arch: all
platform: linux
version: ${ARTHAS_PKG_VERSION}
version_schema: semver
section: admin
priority: optional
maintainer: liubing <liubing0806@users.noreply.github.com>
homepage: https://github.com/liubing0806/allowops
# The licenses that occur in the package, as listed in THIRD_PARTY_NOTICES.
license: Apache-2.0 AND BSD-3-Clause AND EPL-1.0 AND MIT AND 0BSD
description: |-
  Arthas ${ARTHAS_VERSION} files for the allowops jvm_arthas action.
  Optional. Installed under /usr/share/allowops/arthas/${ARTHAS_VERSION}.
contents:
  - dst: /usr/share/allowops
    type: dir
    file_info: {owner: root, group: root, mode: 0755}
  - dst: /usr/share/allowops/arthas
    type: dir
    file_info: {owner: root, group: root, mode: 0755}
  - dst: /usr/share/allowops/arthas/${ARTHAS_VERSION}
    expand: true
    type: dir
    file_info: {owner: root, group: root, mode: 0755}
  - src: ${ARTHAS_STAGE}/arthas-agent.jar
    expand: true
    dst: /usr/share/allowops/arthas/${ARTHAS_VERSION}/arthas-agent.jar
    file_info: {owner: root, group: root, mode: 0644}
  - src: ${ARTHAS_STAGE}/arthas-core.jar
    expand: true
    dst: /usr/share/allowops/arthas/${ARTHAS_VERSION}/arthas-core.jar
    file_info: {owner: root, group: root, mode: 0644}
  - src: ${ARTHAS_STAGE}/arthas-spy.jar
    expand: true
    dst: /usr/share/allowops/arthas/${ARTHAS_VERSION}/arthas-spy.jar
    file_info: {owner: root, group: root, mode: 0644}
  - src: ${ARTHAS_STAGE}/arthas.properties
    expand: true
    dst: /usr/share/allowops/arthas/${ARTHAS_VERSION}/arthas.properties
    file_info: {owner: root, group: root, mode: 0644}
  - src: ${ARTHAS_STAGE}/logback.xml
    expand: true
    dst: /usr/share/allowops/arthas/${ARTHAS_VERSION}/logback.xml
    file_info: {owner: root, group: root, mode: 0644}
  - src: ${ARTHAS_STAGE}/LICENSE
    expand: true
    dst: /usr/share/allowops/arthas/${ARTHAS_VERSION}/LICENSE
    file_info: {owner: root, group: root, mode: 0644}
  - src: ${ARTHAS_STAGE}/NOTICE
    expand: true
    dst: /usr/share/allowops/arthas/${ARTHAS_VERSION}/NOTICE
    file_info: {owner: root, group: root, mode: 0644}
  - src: ${ARTHAS_STAGE}/THIRD_PARTY_NOTICES
    expand: true
    dst: /usr/share/allowops/arthas/${ARTHAS_VERSION}/THIRD_PARTY_NOTICES
    file_info: {owner: root, group: root, mode: 0644}
  - src: ${ARTHAS_STAGE}/SHA256SUMS
    expand: true
    dst: /usr/share/allowops/arthas/${ARTHAS_VERSION}/SHA256SUMS
    file_info: {owner: root, group: root, mode: 0644}
deb:
  compression: gzip
  signature:
    key_file: ${ARTHAS_SIGN_KEY_FILE}
rpm:
  compression: gzip
  # Release signing needs an RSA 4096 private key for rpm 4.11 compatibility.
  signature:
    key_file: ${ARTHAS_SIGN_KEY_FILE}
