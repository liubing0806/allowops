name: PR gates

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-gates-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cli-cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: ./test/cross-compile-check.sh

  console-e2e-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check for console E2E changes
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          run_e2e=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            # A PR merge commit's first parent is the target revision used for this checkout.
            base="$BASE_SHA"
            if git rev-parse --verify -q HEAD^2 >/dev/null; then
              base=HEAD^1
            fi
            changed=$(git diff --name-only --no-renames "$base" HEAD -- \
              web/ internal/gateway/console/ api/ deploy/compose/ test/e2e/)
            if [[ -z "$changed" ]]; then
              run_e2e=false
            fi
          fi
          echo "run_e2e=$run_e2e" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v6
        if: steps.changes.outputs.run_e2e == 'true'
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # pnpm/action-setup@v4 (v4.3.0)
        if: steps.changes.outputs.run_e2e == 'true'
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v6
        if: steps.changes.outputs.run_e2e == 'true'
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            test/e2e/pnpm-lock.yaml
      - uses: actions/setup-python@v6
        if: steps.changes.outputs.run_e2e == 'true'
        with:
          python-version: '3.12'
      - run: python3 -m pip install PyYAML==6.0.3
        if: steps.changes.outputs.run_e2e == 'true'
      - run: make e2e
        id: e2e
        if: steps.changes.outputs.run_e2e == 'true'
      - uses: actions/upload-artifact@v4
        if: always() && steps.e2e.outcome != '' && steps.e2e.outcome != 'skipped'
        with:
          name: console-e2e-pr-${{ github.run_id }}
          path: /tmp/allowops-p10b-evidence.*
          retention-days: 7
