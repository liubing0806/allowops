name: Helm CI

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/helm-ci.yml
      - run: python3 -m pip install PyYAML==6.0.3
      - run: python3 -B deploy/helm/test_verify_matrix.py -v
      - name: Install Helm and kubeconform
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSLo helm.tar.gz https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz
          echo '86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb  helm.tar.gz' | sha256sum --check
          tar -xzf helm.tar.gz linux-amd64/helm
          install -D linux-amd64/helm bin/helm
          GOBIN="$PWD/bin" go install github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0
          echo "$PWD/bin" >> "$GITHUB_PATH"
      - run: python3 deploy/helm/verify_matrix.py --check-schema-coverage --kubeconform kubeconform
