name: Console E2E

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: console-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            test/e2e/pnpm-lock.yaml
      - run: python3 -m pip install PyYAML==6.0.3
      - run: pnpm --dir test/e2e install --frozen-lockfile
      - run: make e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-e2e-${{ github.run_id }}
          path: /tmp/allowops-p10b-evidence.*
          retention-days: 7
