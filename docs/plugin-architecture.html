function canvas(id, h) {
  const cv = document.getElementById(id), dpr = window.devicePixelRatio || 1;
  cv.width = W * dpr; cv.height = h * dpr; cv.style.width = W + 'px'; cv.style.height = h + 'px';

}
function rr(x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function wrap(text, maxW) {
  const out = []; let line = '';
  for (const ch of text) {
    if (g.measureText(line + ch).width > maxW && line) { out.push(line); line = ch; } else line += ch;
  }
  if (line) out.push(line);
  return out;
}
// 方框：标题 + 若干行说明；以 ` 开头的行用等宽字体
function box(x, y, w, h, col, title, lines = [], opt = {}) {
  g.save();
  rr(x, y, w, h, opt.r ?? 8);

  let ty = y + pad + ts;
  g.fillStyle = col.title; g.font = `600 ${ts}px ${opt.monoTitle ? MONO : FONT}`;
  g.textAlign = opt.center ? 'center' : 'left';
  const tx = opt.center ? x + w / 2 : x + pad;
  for (const t of wrap(title, w - 2 * pad)) { g.fillText(t, tx, ty); ty += ts + 5; }
  g.fillStyle = '#374151';
  ty += 2;
  for (const l of lines) {
    const mono = l.startsWith('`');
    g.font = `${fs}px ${mono ? MONO : FONT}`;
    for (const t of wrap(mono ? l.slice(1) : l, w - 2 * pad)) { g.fillText(t, tx, ty); ty += fs + 6; }
  }
  g.restore();
  return { x, y, w, h, cx: x + w / 2, cy: y + h / 2, r: x + w, b: y + h };
}
function arrow(pts, opt = {}) {
  g.save();
  g.strokeStyle = opt.color ?? '#4b5563'; g.fillStyle = opt.color ?? '#4b5563';
  g.lineWidth = opt.lw ?? 1.8;
  if (opt.dash) g.setLineDash(opt.dash);
  g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
  for (const p of pts.slice(1)) g.lineTo(p[0], p[1]);
  g.stroke(); g.setLineDash([]);
  const head = (a, b) => {
    const ang = Math.atan2(b[1] - a[1], b[0] - a[0]), s = 9;
    g.beginPath(); g.moveTo(b[0], b[1]);
    g.lineTo(b[0] - s * Math.cos(ang - 0.4), b[1] - s * Math.sin(ang - 0.4));
    g.lineTo(b[0] - s * Math.cos(ang + 0.4), b[1] - s * Math.sin(ang + 0.4));
    g.closePath(); g.fill();
  };
  head(pts[pts.length - 2], pts[pts.length - 1]);
  if (opt.both) head(pts[1], pts[0]);
  g.restore();
}
function label(text, x, y, opt = {}) {
  g.save();
  const fs = opt.fs ?? 12;
  g.font = `${opt.bold ? 600 : 400} ${fs}px ${opt.mono ? MONO : FONT}`;
  g.textAlign = opt.align ?? 'left';
  if (opt.bg) {
    const w = g.measureText(text).width;
    const bx = opt.align === 'center' ? x - w / 2 : opt.align === 'right' ? x - w : x;
    g.fillStyle = opt.bg; g.fillRect(bx - 4, y - fs, w + 8, fs + 6);
  }
  g.fillStyle = opt.color ?? '#374151';
  g.fillText(text, x, y);
  g.restore();
}

}

}

}
