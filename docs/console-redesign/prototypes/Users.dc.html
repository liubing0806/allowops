<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>allowops · 用户与角色</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4F46E5}a:hover{color:#3730A3}
@keyframes aoPulse{0%{box-shadow:0 0 0 0 rgba(59,130,246,.55)}70%{box-shadow:0 0 0 6px rgba(59,130,246,0)}100%{box-shadow:0 0 0 0 rgba(59,130,246,0)}}
.ao-pulse{animation:aoPulse 1.6s ease-out infinite}
[data-theme="light"] .ao-row:hover,[data-theme="light"] .ao-nav:hover,[data-theme="light"] .ao-ghost:hover{background:#F1F1F3}
[data-theme="dark"] .ao-row:hover,[data-theme="dark"] .ao-nav:hover,[data-theme="dark"] .ao-ghost:hover{background:#1C1C20}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #6366F1;outline-offset:1px}
input::placeholder{color:#8E8E96}
</style>
</helmet>
<div data-theme="{{theme}}" style="position: relative; min-height: 100vh; display: flex; flex-wrap: wrap; font-family: Geist, -apple-system, 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif; font-size: 13px; line-height: 1.5; color: {{t.fg}}; background: {{t.bg}}">
  <div style="flex: 1 1 232px; max-width: 100%; display: flex"><dc-import name="Sidebar" active="users" theme="{{theme}}" hint-size="100%,100vh"></dc-import></div>
  <main style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column">
    <header style="min-height: 52px; box-sizing: border-box; padding: 8px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid {{t.line}}; flex-wrap: wrap">
      <h1 style="margin: 0; font-size: 14px; font-weight: 600">用户与角色</h1>
      <span style="font-size: 12px; color: {{t.muted}}">分配手工角色，并维护身份源组映射</span>
      <span style="flex: 1"></span>
      <label style="position: relative; display: block; flex: 0 1 240px"><span style="position: absolute; left: -9999px">搜索用户</span>
        <svg style="position: absolute; left: 10px; top: 9px" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{t.muted}}" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <input value="{{q}}" onChange="{{onQ}}" placeholder="姓名、用户名或邮箱" style="width: 100%; height: 32px; box-sizing: border-box; padding: 0 10px 0 30px; border-radius: 8px; border: 1px solid {{t.line}}; background: {{t.card}}; color: {{t.fg}}; font: inherit"></label>
    </header>

    <div style="padding: 20px; display: flex; flex-direction: column; gap: 16px; min-width: 0">
      <section aria-label="角色" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px">
        <sc-for list="{{roleCards}}" as="r" hint-placeholder-count="5">
          <div style="padding: 12px 14px; border-radius: 12px; border: 1px solid {{t.line}}; background: {{t.card}}; display: flex; flex-direction: column; gap: 4px">
            <span style="display: flex; align-items: center; gap: 8px"><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-weight: 500; flex: 1">{{r.name}}</span><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; color: {{t.muted}}">{{r.count}} 人</span></span>
            <span style="font-size: 12px; color: {{t.fg2}}">{{r.desc}}</span>
          </div>
        </sc-for>
      </section>

      <section aria-label="用户" style="border-radius: 12px; border: 1px solid {{t.line}}; background: {{t.card}}; overflow: hidden">
        <div style="overflow-x: auto">
          <div role="table" aria-label="用户" style="min-width: 920px">
            <div role="row" style="display: grid; grid-template-columns: minmax(200px, 1.3fr) 100px minmax(150px, 1fr) minmax(130px, 1fr) minmax(130px, 1fr) minmax(170px, 1.2fr); gap: 10px; padding: 0 16px; height: 36px; align-items: center; font-size: 12px; color: {{t.muted}}; border-bottom: 1px solid {{t.line}}"><span role="columnheader">用户</span><span role="columnheader">身份源</span><span role="columnheader">组</span><span role="columnheader">映射角色</span><span role="columnheader">手工角色</span><span role="columnheader">有效角色</span></div>
            <sc-for list="{{rows}}" as="u" hint-placeholder-count="5">
              <button class="ao-row" type="button" onClick="{{u.pick}}" role="row" style="width: 100%; text-align: left; display: grid; grid-template-columns: minmax(200px, 1.3fr) 100px minmax(150px, 1fr) minmax(130px, 1fr) minmax(130px, 1fr) minmax(170px, 1.2fr); gap: 10px; padding: 8px 16px; align-items: center; border: 0; border-bottom: 1px solid {{t.line2}}; background: {{u.bg}}; box-shadow: {{u.edge}}; font: inherit; color: inherit; cursor: pointer">
                <span role="cell" style="display: flex; align-items: center; gap: 10px; min-width: 0"><span style="width: 28px; height: 28px; border-radius: 50%; background: {{t.accentSoft}}; color: {{t.accent}}; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex: none">{{u.initial}}</span><span style="display: flex; flex-direction: column; min-width: 0; line-height: 1.3"><span style="font-weight: 500">{{u.display}}</span><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; color: {{t.muted}}; overflow: hidden; text-overflow: ellipsis">{{u.username}} · {{u.email}}</span></span></span>
                <span role="cell" style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: {{t.fg2}}">{{u.provider}}</span>
                <span role="cell" style="display: flex; flex-wrap: wrap; gap: 4px"><sc-for list="{{u.groups}}" as="g" hint-placeholder-count="1"><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; padding: 0 6px; border-radius: 5px; border: 1px dashed {{t.line}}; color: {{t.fg2}}">{{g.t}}</span></sc-for></span>
                <span role="cell" style="display: flex; flex-wrap: wrap; gap: 4px"><sc-for list="{{u.mapped}}" as="g" hint-placeholder-count="1"><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; padding: 0 6px; border-radius: 5px; background: {{t.pill}}; color: {{t.fg2}}">{{g.t}}</span></sc-for></span>
                <span role="cell" style="display: flex; flex-wrap: wrap; gap: 4px"><sc-for list="{{u.manual}}" as="g" hint-placeholder-count="1"><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; padding: 0 6px; border-radius: 5px; background: {{t.accentSoft}}; color: {{t.accent}}">{{g.t}}</span></sc-for></span>
                <span role="cell" style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; font-weight: 500">{{u.effective}}</span>
              </button>
            </sc-for>
          </div>
        </div>
      </section>

      <section aria-label="组到角色的映射" style="border-radius: 12px; border: 1px solid {{t.line}}; background: {{t.card}}; overflow: hidden">
        <div style="padding: 12px 16px; border-bottom: 1px solid {{t.line2}}; display: flex; align-items: center; gap: 8px; flex-wrap: wrap"><h2 style="margin: 0; font-size: 13px; font-weight: 600; flex: 1">组到角色的映射</h2><span style="font-size: 12px; color: {{t.muted}}">登录时按身份源组自动授予角色</span></div>
        <sc-for list="{{maps}}" as="m" hint-placeholder-count="4">
          <div style="display: flex; gap: 8px; align-items: center; padding: 8px 16px; border-bottom: 1px solid {{t.line2}}; flex-wrap: wrap">
            <label style="flex: 0 1 140px; display: block"><span style="position: absolute; left: -9999px">身份源</span><select value="{{m.provider}}" onChange="{{m.onProvider}}" style="width: 100%; height: 32px; padding: 0 8px; border-radius: 8px; border: 1px solid {{t.line}}; background: {{t.bg}}; color: {{t.fg}}; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px"><option value="corp-oidc">corp-oidc</option><option value="ldap">ldap</option></select></label>
            <label style="flex: 1 1 160px; display: block"><span style="position: absolute; left: -9999px">组名</span><input value="{{m.group}}" onChange="{{m.onGroup}}" placeholder="组名" style="width: 100%; height: 32px; box-sizing: border-box; padding: 0 10px; border-radius: 8px; border: 1px solid {{t.line}}; background: {{t.bg}}; color: {{t.fg}}; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px"></label>
            <span style="color: {{t.muted}}">→</span>
            <label style="flex: 2 1 200px; display: block"><span style="position: absolute; left: -9999px">映射角色</span><input value="{{m.roles}}" onChange="{{m.onRoles}}" placeholder="映射角色（逗号分隔）" style="width: 100%; height: 32px; box-sizing: border-box; padding: 0 10px; border-radius: 8px; border: 1px solid {{t.line}}; background: {{t.bg}}; color: {{t.fg}}; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px"></label>
            <button class="ao-ghost" type="button" onClick="{{m.remove}}" aria-label="删除这条映射" style="width: 32px; height: 32px; border-radius: 8px; border: 0; background: transparent; color: {{t.muted}}; cursor: pointer">×</button>
          </div>
        </sc-for>
        <div style="padding: 10px 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap">
          <button class="ao-ghost" type="button" onClick="{{addMap}}" style="height: 32px; padding: 0 12px; border-radius: 8px; border: 1px dashed {{t.line}}; background: transparent; color: {{t.fg2}}; font: inherit; cursor: pointer">+ 添加映射</button>
          <span style="flex: 1"></span>
          <sc-if value="{{mapsDirty}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; color: {{t.amber}}">有未保存修改</span></sc-if>
          <button type="button" onClick="{{saveMaps}}" style="height: 32px; padding: 0 14px; border-radius: 8px; border: 0; background: {{saveMapsBg}}; color: #FFFFFF; font: inherit; font-weight: 500; cursor: pointer">保存映射</button>
        </div>
      </section>
    </div>
  </main>

  <sc-if value="{{hasDetail}}" hint-placeholder-val="{{ false }}">
    <aside aria-label="分配角色" style="position: absolute; top: 64px; right: 12px; width: 400px; max-width: calc(100% - 24px); box-sizing: border-box; border-radius: 14px; background: {{t.pop}}; border: 1px solid {{t.line}}; box-shadow: 0 24px 60px rgba(20,22,30,.20), 0 2px 8px rgba(20,22,30,.06); display: flex; flex-direction: column; overflow: hidden">
      <div style="padding: 14px 14px 12px 16px; display: flex; gap: 10px; align-items: flex-start; border-bottom: 1px solid {{t.line2}}">
        <div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><h2 style="margin: 0; font-size: 15px; font-weight: 600">分配角色 {{d.display}}</h2><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: {{t.muted}}">{{d.username}} · {{d.provider}}</span></div>
        <button class="ao-ghost" type="button" onClick="{{closeDetail}}" aria-label="关闭" style="width: 30px; height: 30px; border-radius: 7px; border: 0; background: transparent; color: {{t.fg2}}; cursor: pointer">×</button>
      </div>
      <div style="padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; max-height: 520px; overflow-y: auto">
        <sc-for list="{{d.opts}}" as="o" hint-placeholder-count="6">
          <label style="display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 8px; border: 1px solid {{o.border}}; background: {{o.bg}}; cursor: pointer">
            <input type="checkbox" checked="{{o.checked}}" onChange="{{o.toggle}}" disabled="{{o.locked}}" style="margin-top: 3px; accent-color: #4F46E5">
            <span style="flex: 1; display: flex; flex-direction: column"><span style="display: flex; gap: 6px; align-items: center"><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-weight: 500">{{o.name}}</span><sc-if value="{{o.locked}}" hint-placeholder-val="{{ false }}"><span style="font-size: 11px; color: {{t.muted}}">来自组映射</span></sc-if></span><span style="font-size: 12px; color: {{t.fg2}}">{{o.desc}}</span></span>
          </label>
        </sc-for>
      </div>
      <div style="padding: 12px 16px; border-top: 1px solid {{t.line2}}; display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 12px; color: {{t.muted}}">草稿取映射角色和手工角色的并集：<span style="font-family: 'Geist Mono', ui-monospace, monospace; color: {{t.fg}}">{{d.preview}}</span></span>
        <div style="display: flex; justify-content: flex-end"><button type="button" onClick="{{saveRoles}}" style="height: 32px; padding: 0 14px; border-radius: 8px; border: 0; background: #4F46E5; color: #FFFFFF; font: inherit; font-weight: 500; cursor: pointer">保存角色</button></div>
      </div>
    </aside>
  </sc-if>

  <sc-if value="{{toast}}" hint-placeholder-val="{{ false }}">
    <div role="status" style="position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 12px; border-radius: 10px; background: #18181B; color: #FAFAFA; box-shadow: 0 8px 24px rgba(0,0,0,.2)">
      <span style="width: 6px; height: 6px; border-radius: 50%; background: #4ADE80"></span><span>{{toast}}</span>
      <button type="button" onClick="{{closeToast}}" aria-label="关闭提示" style="width: 26px; height: 26px; border-radius: 6px; border: 0; background: transparent; color: #A1A1AA; cursor: pointer">×</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"light","options":["light","dark"]},"$preview":{"width":1440,"height":1080}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const U = (display, username, email, provider, groups, manual) => ({ display, username, email, provider, groups, manual });
    const maps = [
      { provider: 'corp-oidc', group: 'platform-admins', roles: 'admin' },
      { provider: 'corp-oidc', group: 'sre', roles: 'operator' },
      { provider: 'corp-oidc', group: 'java-team', roles: 'viewer' },
      { provider: 'ldap', group: 'security', roles: 'auditor' }
    ];
    this.state = {
      users: [
        U('刘冰', 'liu.bing', 'liu.bing@example.com', 'corp-oidc', ['platform-admins', 'sre'], []),
        U('王敏', 'wang.min', 'wang.min@example.com', 'corp-oidc', ['sre'], ['publisher']),
        U('陈宇', 'chen.yu', 'chen.yu@example.com', 'corp-oidc', ['java-team'], ['java-diagnostician']),
        U('赵磊', 'zhao.lei', 'zhao.lei@example.com', 'ldap', ['security'], []),
        U('孙悦', 'sun.yue', 'sun.yue@example.com', 'ldap', [], ['viewer'])
      ],
      maps, savedMaps: JSON.stringify(maps), q: '', open: null, draft: {}, toast: ''
    };
  }
  roleDefs() {
    return [
      ['admin', '管理策略、服务账号、主机、join token、用户角色'], ['operator', '管理主机、创建 join token、查看 job'],
      ['auditor', '查看审计、job 和命令输出'], ['viewer', '查看主机、目录和 job 摘要'], ['publisher', '发布目录'],
      ['java-diagnostician', '策略自定义：Arthas L1 + 工作时段 L2'], ['ops-maintainer', '策略自定义：tier=web 维护 action']
    ];
  }
  list(s) { return String(s || '').split(',').map((x) => x.trim()).filter(Boolean); }
  mapped(u, maps) {
    const out = [];
    maps.forEach((m) => { if (m.provider === u.provider && u.groups.indexOf(m.group) >= 0) this.list(m.roles).forEach((r) => { if (out.indexOf(r) < 0) out.push(r); }); });
    return out;
  }
  tokens(dark) {
    return dark
      ? { bg: '#0B0B0D', card: '#141417', pop: 'rgba(24,24,28,.97)', line: '#27272C', line2: '#1D1D21', fg: '#EDEDF0', fg2: '#B4B4BC', muted: '#8E8E98', pill: '#1F1F24', accent: '#A5B4FC', accentSoft: '#25264A', amber: '#FBBF24', sel: '#17182A', selEdge: '#A5B4FC' }
      : { bg: '#FAFAFA', card: '#FFFFFF', pop: 'rgba(255,255,255,.97)', line: '#E4E4E7', line2: '#F0F0F2', fg: '#18181B', fg2: '#52525B', muted: '#6B6B74', pill: '#F1F1F3', accent: '#4F46E5', accentSoft: '#EEEDFD', amber: '#B45309', sel: '#F5F5FF', selEdge: '#4F46E5' };
  }
  renderVals() {
    const theme = this.props.theme ?? 'light';
    const t = this.tokens(theme === 'dark');
    const s = this.state;
    const set = (p) => this.setState(p);
    const defs = this.roleDefs();
    const eff = (u) => { const m = this.mapped(u, s.maps); return m.concat(u.manual.filter((r) => m.indexOf(r) < 0)); };
    const ql = s.q.trim().toLowerCase();
    const rows = s.users.filter((u) => !ql || (u.display + u.username + u.email).toLowerCase().indexOf(ql) >= 0).map((u) => {
      const on = s.open === u.username;
      const m = this.mapped(u, s.maps);
      return {
        display: u.display, username: u.username, email: u.email, provider: u.provider, initial: u.display.slice(0, 1),
        groups: u.groups.length ? u.groups.map((g) => ({ t: g })) : [{ t: '—' }],
        mapped: m.length ? m.map((r) => ({ t: r })) : [{ t: '—' }],
        manual: u.manual.length ? u.manual.map((r) => ({ t: r })) : [{ t: '—' }],
        effective: eff(u).join(', ') || '—',
        bg: on ? t.sel : 'transparent', edge: on ? 'inset 2px 0 0 ' + t.selEdge : 'none',
        pick: () => { const dr = {}; u.manual.forEach((r) => { dr[r] = true; }); set({ open: u.username, draft: dr }); }
      };
    });
    const cur = s.users.find((u) => u.username === s.open);
    let d = {};
    if (cur) {
      const m = this.mapped(cur, s.maps);
      const manual = defs.map((x) => x[0]).filter((r) => s.draft[r] && m.indexOf(r) < 0);
      d = {
        display: cur.display, username: cur.username, provider: cur.provider,
        preview: m.concat(manual).join(', ') || '（无）',
        opts: defs.map(([name, desc]) => {
          const locked = m.indexOf(name) >= 0;
          const checked = locked || !!s.draft[name];
          return { name, desc, locked, checked, bg: checked ? t.sel : 'transparent', border: checked ? t.accentSoft : t.line, toggle: () => set({ draft: Object.assign({}, s.draft, { [name]: !s.draft[name] }) }) };
        })
      };
    }
    const upd = (i, k) => (e) => set({ maps: s.maps.map((m, j) => j === i ? Object.assign({}, m, { [k]: e.target.value }) : m) });
    const mapsDirty = JSON.stringify(s.maps) !== s.savedMaps;
    return {
      theme, t, q: s.q, onQ: (e) => set({ q: e.target.value }), rows,
      roleCards: defs.slice(0, 5).map(([name, desc]) => ({ name, desc, count: s.users.filter((u) => eff(u).indexOf(name) >= 0).length })),
      maps: s.maps.map((m, i) => ({ provider: m.provider, group: m.group, roles: m.roles, onProvider: upd(i, 'provider'), onGroup: upd(i, 'group'), onRoles: upd(i, 'roles'), remove: () => set({ maps: s.maps.filter((_, j) => j !== i) }) })),
      addMap: () => set({ maps: s.maps.concat([{ provider: 'corp-oidc', group: '', roles: '' }]) }),
      mapsDirty, saveMapsBg: mapsDirty ? '#4F46E5' : '#A1A1AA',
      saveMaps: () => mapsDirty && set({ savedMaps: JSON.stringify(s.maps), toast: '角色映射已保存' }),
      hasDetail: !!cur, d, closeDetail: () => set({ open: null }),
      saveRoles: () => {
        if (!cur) return;
        const m = this.mapped(cur, s.maps);
        const manual = defs.map((x) => x[0]).filter((r) => s.draft[r] && m.indexOf(r) < 0);
        set({ users: s.users.map((u) => u.username === cur.username ? Object.assign({}, u, { manual }) : u), open: null, toast: '角色已保存' });
      },
      toast: s.toast, closeToast: () => set({ toast: '' })
    };
  }
}
</script>
</body>
</html>
