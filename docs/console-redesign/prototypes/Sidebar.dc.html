<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>allowops 侧栏</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="控制台导航" style="width: 100%; min-height: 100vh; box-sizing: border-box; padding: 12px 10px; background: {{t.side}}; border-right: 1px solid {{t.line}}; display: flex; flex-direction: column; gap: 2px; font-family: Geist, -apple-system, 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif; font-size: 13px; line-height: 1.5; color: {{t.fg}}">
  <div style="display: flex; align-items: center; gap: 9px; padding: 6px 8px 12px">
    <span style="width: 24px; height: 24px; border-radius: 7px; background: {{t.fg}}; color: {{t.side}}; display: flex; align-items: center; justify-content: center">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l4 4 10-10"></path></svg>
    </span>
    <span style="display: flex; flex-direction: column; line-height: 1.2"><span style="font-weight: 600">allowops</span><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; color: {{t.muted}}">prod-gateway</span></span>
  </div>
  <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
    <div style="padding: 12px 10px 4px; font-size: 11px; font-weight: 500; color: {{t.muted}}">{{g.label}}</div>
    <sc-for list="{{g.items}}" as="n" hint-placeholder-count="4">
      <a class="ao-nav" href="{{n.href}}" aria-current="{{n.current}}" style="height: 32px; padding: 0 10px; border-radius: 7px; color: {{n.fg}}; font-weight: {{n.weight}}; background: {{n.bg}}; box-shadow: {{n.shadow}}; text-decoration: none; display: flex; align-items: center; gap: 10px">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"></path></svg>
        <span style="flex: 1">{{n.label}}</span>
        <sc-if value="{{n.hasBadge}}" hint-placeholder-val="{{ false }}"><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; color: {{n.badgeColor}}">{{n.badge}}</span></sc-if>
        <sc-if value="{{n.live}}" hint-placeholder-val="{{ false }}"><span class="ao-pulse" style="width: 6px; height: 6px; border-radius: 50%; background: #3B82F6"></span></sc-if>
      </a>
    </sc-for>
  </sc-for>
  <div style="flex: 1; min-height: 16px"></div>
  <div style="display: flex; align-items: center; gap: 9px; padding: 8px">
    <span style="width: 26px; height: 26px; border-radius: 50%; background: {{t.accentSoft}}; color: {{t.accent}}; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center">LB</span>
    <span style="flex: 1; display: flex; flex-direction: column; line-height: 1.25; min-width: 0"><span style="font-weight: 500">liu.bing</span><span style="display: flex; align-items: center; gap: 5px; font-size: 11px; color: {{t.muted}}"><span style="width: 6px; height: 6px; border-radius: 50%; background: {{t.green}}"></span>admin · 网关已连接</span></span>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","default":"hosts","options":["overview","hosts","jobs","audit","catalog","policies","accounts","join","users","system"]},"theme":{"editor":"enum","default":"light","options":["light","dark"]},"$preview":{"width":232,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.theme ?? 'light') === 'dark';
    const t = dark
      ? { side: '#0F0F12', card: '#141417', line: '#27272C', fg: '#EDEDF0', fg2: '#B4B4BC', muted: '#8E8E98', accent: '#A5B4FC', accentSoft: '#25264A', green: '#4ADE80', amber: '#FBBF24' }
      : { side: '#F4F4F5', card: '#FFFFFF', line: '#E4E4E7', fg: '#18181B', fg2: '#52525B', muted: '#6B6B74', accent: '#4F46E5', accentSoft: '#EEEDFD', green: '#16A34A', amber: '#B45309' };
    const active = this.props.active ?? 'hosts';
    const I = {
      overview: 'M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z',
      hosts: 'M3 4h18v7H3zM3 13h18v7H3zM7 7.5h.01M7 16.5h.01',
      jobs: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM10 8.5v7l5.5-3.5z',
      audit: 'M8 4h11v16H8a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3zM9 9h6M9 13h6',
      catalog: 'M4 5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2zM9 3v18',
      policies: 'M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z',
      accounts: 'M7 8h10a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3v-6a3 3 0 0 1 3-3zM12 4v4M9 13h.01M15 13h.01',
      join: 'M8 11a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM11 12l9-9M17 6l3 3',
      users: 'M9 4.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zM2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.8c1.6.8 2.7 2.5 3 5.2',
      system: 'M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1'
    };
    const item = (id, label, href, badge, badgeColor, live) => {
      const on = id === active;
      return {
        label, href, icon: I[id], current: on ? 'page' : 'false',
        fg: on ? t.fg : t.fg2, weight: on ? '500' : '400', bg: on ? t.card : 'transparent',
        shadow: on ? '0 1px 2px rgba(0,0,0,.06), 0 0 0 .5px ' + t.line : 'none',
        hasBadge: !!badge, badge: badge || '', badgeColor: badgeColor || t.muted, live: !!live
      };
    };
    return {
      t,
      groups: [
        { label: '运行', items: [
          item('overview', '概览', 'Overview.dc.html', '', '', false),
          item('hosts', '主机', 'Main.dc.html', '10', '', false),
          item('jobs', 'Job', 'Jobs.dc.html', '', '', true),
          item('audit', '审计', 'Audit.dc.html', '', '', false)
        ] },
        { label: '治理', items: [
          item('catalog', '目录', 'Catalog.dc.html', '11 天', t.amber, false),
          item('policies', '策略', 'Policies.dc.html', 'v7', '', false),
          item('accounts', '服务账号', 'ServiceAccounts.dc.html', '', '', false),
          item('join', 'Join token', 'JoinTokens.dc.html', '', '', false)
        ] },
        { label: '管理', items: [
          item('users', '用户与角色', 'Users.dc.html', '', '', false),
          item('system', '系统', 'System.dc.html', '', '', false)
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
